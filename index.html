<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shopping app</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Courier+Prime:wght@400;700&family=Inter:wght@400;500&display=swap">
<style>
:root{
  --bg:#dde4ea; --card:#f7f9fb; --paper:#ffffff; --ink:#18232e; --muted:#5d6b78;
  --line:#c3ced8; --accent:#0a8fb8; --accent-ink:#ffffff; --good:#2f7d1f; --bad:#c42b37;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#10171d; --card:#18222b; --paper:#1f2b36; --ink:#e7eef4; --muted:#93a3b2;
    --line:#2e3d4a; --accent:#3fc1e8; --accent-ink:#06222c; --good:#7fd35f; --bad:#ff7a84;
    color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Inter,system-ui,sans-serif}
h1,h2{font-family:"Bricolage Grotesque",Inter,sans-serif;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(1.8rem,4vw,2.6rem);font-weight:700;line-height:1.1}
h2{font-size:1.15rem;font-weight:700}
.wrap{max-width:1040px;margin:0 auto;padding:28px 18px 48px}
header p{margin:6px 0 0;color:var(--muted);max-width:52ch}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;margin-top:24px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px}
.panel + .panel{margin-top:16px}
form.add{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:10px;align-items:end;margin-top:12px}
@media (max-width:560px){form.add{grid-template-columns:1fr 1fr}form.add .f-name{grid-column:1/-1}}
label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:4px}
input{width:100%;font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:9px 10px}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:500 1rem Inter,sans-serif;cursor:pointer;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:9px 16px}
button.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
button.ghost:hover{border-color:var(--bad);color:var(--bad)}
.err{color:var(--bad);min-height:1.4em;margin:8px 0 0;font-size:.9rem}
.searchrow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.searchrow input{max-width:240px}
ul.items{list-style:none;margin:12px 0 0;padding:0}
ul.items li{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:12px 8px;border-top:1px solid var(--line)}
.pname{font-weight:500;overflow-wrap:anywhere}
.meta{color:var(--muted);font-size:.9rem}
.badge{display:inline-block;margin-left:8px;font-size:.78rem;padding:1px 8px;border-radius:99px;background:var(--accent);color:var(--accent-ink);vertical-align:2px}
.sub{font-variant-numeric:tabular-nums;font-weight:500}
.empty{color:var(--muted);margin:14px 0 0}
.receipt{position:sticky;top:16px;background:var(--paper);border:1px solid var(--line);padding:20px 18px 26px;font-family:"Courier Prime",ui-monospace,monospace;
  -webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/14px 100%;mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/14px 100%}
.receipt h2{font-family:"Courier Prime",monospace;text-align:center;font-size:1.1rem}
.rl{display:flex;justify-content:space-between;gap:10px;font-size:.95rem;padding:2px 0}
.rl span:first-child{overflow-wrap:anywhere}
.rl span:last-child{white-space:nowrap;font-variant-numeric:tabular-nums}
.sep{border-top:1px dashed var(--muted);margin:10px 0}
.rl.disc{color:var(--good)}
.rl.total{font-weight:700;font-size:1.25rem;padding-top:4px}
.hint{font-size:.85rem;color:var(--muted);margin-top:12px;text-align:center}
.top{font-size:.9rem;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Shopping app</h1>
    <p>Add products, then check your receipt. Orders over 500 AZN get 5% off, and orders over 1000 AZN get 10% off.</p>
  </header>

  <div class="grid">
    <main>
      <section class="panel" aria-labelledby="addh">
        <h2 id="addh">Add a product</h2>
        <form class="add" id="addForm" novalidate>
          <div class="f-name"><label for="name">Name</label><input id="name" autocomplete="off" placeholder="Laptop"></div>
          <div><label for="price">Price (AZN)</label><input id="price" type="number" min="0" step="0.01" inputmode="decimal" placeholder="1200"></div>
          <div><label for="qty">Quantity</label><input id="qty" type="number" min="1" step="1" inputmode="numeric" value="1"></div>
          <button type="submit">Add product</button>
        </form>
        <p class="err" id="err" role="alert"></p>
      </section>

      <section class="panel" aria-labelledby="listh">
        <div class="searchrow">
          <h2 id="listh">Products</h2>
          <div><label for="search" style="position:absolute;left:-9999px">Search by name</label>
          <input id="search" type="search" placeholder="Search by name" autocomplete="off"></div>
        </div>
        <ul class="items" id="list"></ul>
        <p class="empty" id="empty"></p>
      </section>
    </main>

    <aside>
      <div class="receipt" aria-live="polite" aria-label="Receipt">
        <h2>RECEIPT</h2>
        <div class="sep"></div>
        <div id="lines"></div>
        <div class="sep"></div>
        <div class="rl"><span>Subtotal</span><span id="subtotal">0.00 AZN</span></div>
        <div class="rl disc"><span id="discLabel">Discount (0%)</span><span id="discAmt">-0.00 AZN</span></div>
        <div class="sep"></div>
        <div class="rl total"><span>TOTAL</span><span id="total">0.00 AZN</span></div>
        <div class="top" id="top"></div>
        <div class="hint" id="hint"></div>
      </div>
    </aside>
  </div>
</div>

<script>
window.startApp = function(){
  var $ = function(id){ return document.getElementById(id); };
  var money = function(n){ return Number(n).toFixed(2) + ' AZN'; };

  // C++ functions compiled to WebAssembly (see shopping.cpp)
  var addProduct = Module.cwrap('add_product', 'number', ['string', 'number', 'number']);
  var removeProduct = Module.cwrap('remove_product', 'number', ['number']);
  var getReceipt = Module.cwrap('get_receipt', 'string', []);
  var searchProducts = Module.cwrap('search_products', 'string', ['string']);

  var errors = {
    1: 'Enter a product name (up to 100 characters).',
    2: 'Enter a price of 0 or more.',
    3: 'Enter a whole quantity of 1 or more.',
    4: 'You can add up to 100 products.'
  };

  function el(tag, cls, text){
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function refresh(){
    var q = $('search').value.trim();
    var rec = JSON.parse(getReceipt());
    var visible = q ? JSON.parse(searchProducts(q)).items : rec.items;
    renderList(visible, rec, q);
    renderReceipt(rec);
  }

  function renderList(visible, rec, q){
    var list = $('list');
    list.textContent = '';
    var topId = rec.mostExpensive ? rec.mostExpensive.id : null;

    visible.forEach(function(p){
      var li = el('li');
      var info = el('div');
      info.appendChild(el('span', 'pname', p.name));
      if (p.id === topId && rec.items.length > 1) info.appendChild(el('span', 'badge', 'Most expensive'));
      info.appendChild(el('div', 'meta', money(p.price) + ' × ' + p.quantity));
      li.appendChild(info);
      li.appendChild(el('span', 'sub', money(p.subtotal)));
      var rm = el('button', 'ghost', 'Remove');
      rm.type = 'button';
      rm.setAttribute('aria-label', 'Remove ' + p.name);
      rm.addEventListener('click', function(){ removeProduct(p.id); refresh(); });
      li.appendChild(rm);
      list.appendChild(li);
    });

    var empty = $('empty');
    if (!rec.items.length) empty.textContent = 'No products yet. Add your first product above.';
    else if (!visible.length) empty.textContent = 'No product matches “' + q + '”. Try a different name.';
    else empty.textContent = '';
  }

  function renderReceipt(rec){
    var lines = $('lines');
    lines.textContent = '';
    rec.items.forEach(function(p){
      var row = el('div', 'rl');
      row.appendChild(el('span', '', p.name + (p.quantity > 1 ? ' ×' + p.quantity : '')));
      row.appendChild(el('span', '', money(p.subtotal)));
      lines.appendChild(row);
    });
    if (!rec.items.length) lines.appendChild(el('div', 'meta', 'Nothing added yet'));

    $('subtotal').textContent = money(rec.subtotal);
    $('discLabel').textContent = 'Discount (' + rec.discountPercent + '%)';
    $('discAmt').textContent = '-' + money(rec.discountAmount);
    $('total').textContent = money(rec.total);
    $('top').textContent = rec.mostExpensive
      ? 'Most expensive: ' + rec.mostExpensive.name + ' (' + money(rec.mostExpensive.price) + ')' : '';

    var hint = '';
    if (rec.items.length && rec.subtotal <= 500) hint = 'Spend ' + (500 - rec.subtotal + 0.01).toFixed(2) + ' AZN more to get 5% off.';
    else if (rec.subtotal > 500 && rec.subtotal <= 1000) hint = 'Spend ' + (1000 - rec.subtotal + 0.01).toFixed(2) + ' AZN more to get 10% off.';
    $('hint').textContent = hint;
  }

  $('addForm').addEventListener('submit', function(e){
    e.preventDefault();
    var qty = parseFloat($('qty').value);
    var code = addProduct($('name').value, parseFloat($('price').value), Number.isInteger(qty) ? qty : 0);
    if (code !== 0){
      $('err').textContent = errors[code];
      return;
    }
    $('err').textContent = '';
    $('name').value = ''; $('price').value = ''; $('qty').value = '1';
    $('name').focus();
    refresh();
  });

  $('search').addEventListener('input', refresh);
  refresh();
};
</script>
<script>var Module = { onRuntimeInitialized: function(){ window.startApp(); } };</script>
<script src="shopping.js"></script>
</body>
</html>
